<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#d9dad3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="E-ink cam">
<title>E-ink cam</title>
<style>
  :root {
    --ink: #1b1c1b;
    --paper: #d9dad3;
    --rule: 2px;
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-size: 17px;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  button {
    font: inherit;
    color: inherit;
    background: none;
    border: var(--rule) solid var(--ink);
    border-radius: 0;
    min-height: 46px;
    padding: 0 16px;
    cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  main { flex: 1; min-height: 0; padding: 12px 12px 4px; display: flex; }
  .stage { flex: 1; position: relative; min-height: 0; min-width: 0; }
  .frame {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    border: var(--rule) solid var(--ink);
    background: var(--ink);
    overflow: hidden;
  }
  #view { display: block; width: 100%; height: 100%; object-fit: contain; }
  #view.mirror { transform: scaleX(-1); }
  #video { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  .note {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 24px; text-align: center; line-height: 1.4;
    background: var(--ink); color: var(--paper);
  }
  .note[hidden] { display: none; }
  .note button { border-color: var(--paper); }
  .note button:active { background: var(--paper); color: var(--ink); }

  footer {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 12px 16px 16px;
  }
  .modes { display: flex; justify-self: start; border: var(--rule) solid var(--ink); }
  .modes button { border: 0; min-width: 58px; padding: 0 12px; }
  .modes button + button { border-left: var(--rule) solid var(--ink); }
  .modes button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

  #shutter {
    width: 78px; height: 78px; min-height: 0; padding: 0;
    border: 3px solid var(--ink); border-radius: 50%;
    background: var(--paper); position: relative;
  }
  #shutter::after {
    content: ""; position: absolute; inset: 6px; border-radius: 50%; background: var(--ink);
  }
  #shutter:active::after { background: var(--paper); }

  #flip { justify-self: end; width: 48px; height: 48px; padding: 0; display: grid; place-items: center; }
  #flip:active { background: var(--ink); color: var(--paper); }

  .review {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column;
    background: var(--paper);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .review[hidden] { display: none; }
  .shotwrap { flex: 1; min-height: 0; padding: 12px; display: flex; }
  .shotbox { flex: 1; min-height: 0; border: var(--rule) solid var(--ink); background: var(--ink); }
  #shot { display: block; width: 100%; height: 100%; object-fit: contain; }
  .actions { display: flex; gap: 12px; padding: 8px 12px 16px; }
  .actions button { flex: 1; }
  .actions #save { background: var(--ink); color: var(--paper); }
  .actions button:not(#save):active { background: var(--ink); color: var(--paper); }
  .actions #save:active { background: var(--paper); color: var(--ink); }
  .actions [hidden] { display: none; }

  .toast {
    position: fixed; z-index: 40; left: 50%;
    top: calc(env(safe-area-inset-top) + 18px);
    transform: translateX(-50%);
    background: var(--ink); color: var(--paper);
    padding: 10px 18px; pointer-events: none;
  }
  .toast[hidden] { display: none; }

  .refresh { position: fixed; inset: 0; z-index: 30; pointer-events: none; opacity: 0; }
</style>
</head>
<body>

<main>
  <div class="stage" id="stage">
    <div class="frame" id="frame">
      <canvas id="view" width="600" height="800"></canvas>
      <div class="note" id="note" hidden>
        <p id="noteText"></p>
        <button id="retry">Try again</button>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="modes" role="group" aria-label="Filter">
    <button id="mBw" aria-pressed="true">B&amp;W</button>
    <button id="mColor" aria-pressed="false">Color</button>
  </div>
  <button id="shutter" aria-label="Take photo"></button>
  <button id="flip" aria-label="Switch camera">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true">
      <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/>
      <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/>
    </svg>
  </button>
</footer>

<video id="video" playsinline muted autoplay></video>

<section class="review" id="review" hidden aria-label="Photo preview">
  <div class="shotwrap"><div class="shotbox"><img id="shot" alt="Captured e-ink photo"></div></div>
  <div class="actions">
    <button id="retake">Retake</button>
    <button id="download">Download</button>
    <button id="save">Save</button>
  </div>
</section>

<div class="refresh" id="refresh"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
  'use strict';

  /* ---- Look settings: tweak these to change the style ---- */
  const CFG = {
    bwLevels: 8,        // gray steps in B&W mode (2 = pure black/white, 16 = smooth Kindle-like)
    colorLevels: 5,     // steps per color channel in Color mode (fewer = more muted, grainier)
    saturation: 0.72,   // Color mode: 1 = original, lower = more washed out
    contrast: 1.3,      // 1 = unchanged
    brightness: 0.02,   // -0.2 to 0.2
    ink:   [26, 27, 26],
    paper: [228, 229, 221]
  };

  const $ = id => document.getElementById(id);
  const video = $('video'), view = $('view');
  const work = document.createElement('canvas');
  const vctx = view.getContext('2d');
  const wctx = work.getContext('2d', { willReadFrequently: true });
  const stage = $('stage'), frame = $('frame');
  const note = $('note'), noteText = $('noteText');
  const review = $('review'), shot = $('shot');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

  let mode = 'bw';
  let facing = 'environment';
  let stream = null, running = false, paused = false, loopId = 0;
  let currentBlob = null, currentUrl = null, currentName = '';

  /* ---- Ordered dithering (8x8 Bayer) — stable from frame to frame, so no flicker ---- */
  function bayer(n) {
    let m = [[0]];
    while (m.length < n) {
      const s = m.length, o = [];
      for (let y = 0; y < s * 2; y++) o.push(new Array(s * 2));
      for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) {
        const v = m[y][x] * 4;
        o[y][x] = v; o[y][x + s] = v + 2; o[y + s][x] = v + 3; o[y + s][x + s] = v + 1;
      }
      m = o;
    }
    return m;
  }
  const B = bayer(8);
  const T = new Float32Array(64);
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) T[y * 8 + x] = (B[y][x] + 0.5) / 64;

  // contrast curve, 0..1 output
  const LUT = new Float32Array(256);
  for (let i = 0; i < 256; i++) {
    const v = (i / 255 - 0.5) * CFG.contrast + 0.5 + CFG.brightness;
    LUT[i] = v < 0 ? 0 : v > 1 ? 1 : v;
  }

  // palettes: each level maps from ink to paper
  function ramp(levels, c) {
    const a = new Uint8Array(levels);
    for (let k = 0; k < levels; k++) a[k] = Math.round(CFG.ink[c] + (CFG.paper[c] - CFG.ink[c]) * (k / (levels - 1)));
    return a;
  }
  const bwR = ramp(CFG.bwLevels, 0), bwG = ramp(CFG.bwLevels, 1), bwB = ramp(CFG.bwLevels, 2);
  const bwPal = new Uint32Array(CFG.bwLevels);
  for (let k = 0; k < CFG.bwLevels; k++) bwPal[k] = (0xFF000000 | (bwB[k] << 16) | (bwG[k] << 8) | bwR[k]) >>> 0;
  const cR = ramp(CFG.colorLevels, 0), cG = ramp(CFG.colorLevels, 1), cB = ramp(CFG.colorLevels, 2);

  function process(img) {
    const d = img.data, w = img.width, h = img.height;
    const out = new Uint32Array(d.buffer);
    let p = 0, i = 0;
    if (mode === 'bw') {
      const L = CFG.bwLevels - 1;
      for (let y = 0; y < h; y++) {
        const row = (y & 7) << 3;
        for (let x = 0; x < w; x++, p++, i += 4) {
          const l = 0.299 * LUT[d[i]] + 0.587 * LUT[d[i + 1]] + 0.114 * LUT[d[i + 2]];
          const s = l * L;
          let k = s | 0;
          if (s - k > T[row | (x & 7)]) k++;
          out[p] = bwPal[k];
        }
      }
    } else {
      const L = CFG.colorLevels - 1, sat = CFG.saturation;
      for (let y = 0; y < h; y++) {
        const row = (y & 7) << 3;
        for (let x = 0; x < w; x++, p++, i += 4) {
          let r = LUT[d[i]], g = LUT[d[i + 1]], b = LUT[d[i + 2]];
          const l = 0.299 * r + 0.587 * g + 0.114 * b;
          r = l + (r - l) * sat; g = l + (g - l) * sat; b = l + (b - l) * sat;
          r = r < 0 ? 0 : r > 1 ? 1 : r;
          g = g < 0 ? 0 : g > 1 ? 1 : g;
          b = b < 0 ? 0 : b > 1 ? 1 : b;
          const t = T[row | (x & 7)];
          let sr = r * L, kr = sr | 0; if (sr - kr > t) kr++;
          let sg = g * L, kg = sg | 0; if (sg - kg > t) kg++;
          let sb = b * L, kb = sb | 0; if (sb - kb > t) kb++;
          out[p] = (0xFF000000 | (cB[kb] << 16) | (cG[kg] << 8) | cR[kr]) >>> 0;
        }
      }
    }
  }

  /* ---- Sizing: always 4:3 (tall when the phone is upright, wide when sideways) ---- */
  function dims() { return innerHeight > innerWidth ? [600, 800] : [800, 600]; }

  function layout() {
    const sw = stage.clientWidth, sh = stage.clientHeight;
    if (!sw || !sh) return;
    const ar = view.width / view.height;
    let w = sw, h = w / ar;
    if (h > sh) { h = sh; w = h * ar; }
    frame.style.width = Math.floor(w) + 'px';
    frame.style.height = Math.floor(h) + 'px';
  }

  function setSize() {
    const [W, H] = dims();
    if (view.width !== W || view.height !== H) {
      view.width = W; view.height = H;
      work.width = W; work.height = H;
      layout();
    }
  }

  /* ---- Live loop ---- */
  function drawCover() {
    const vw = video.videoWidth, vh = video.videoHeight;
    const W = work.width, H = work.height;
    const target = W / H, src = vw / vh;
    let sx = 0, sy = 0, sw = vw, sh = vh;
    if (src > target) { sw = vh * target; sx = (vw - sw) / 2; }
    else { sh = vw / target; sy = (vh - sh) / 2; }
    wctx.drawImage(video, sx, sy, sw, sh, 0, 0, W, H);
  }

  function step() {
    if (paused || video.readyState < 2 || !video.videoWidth) return;
    setSize();
    drawCover();
    const img = wctx.getImageData(0, 0, work.width, work.height);
    process(img);
    vctx.putImageData(img, 0, 0);
  }

  function schedule(fn) {
    if ('requestVideoFrameCallback' in video) video.requestVideoFrameCallback(fn);
    else requestAnimationFrame(fn);
  }

  function startLoop() {
    const id = ++loopId;
    const tick = () => {
      if (id !== loopId || !running) return;
      step();
      schedule(tick);
    };
    schedule(tick);
  }

  /* ---- Camera ---- */
  function stopCamera() {
    running = false;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  }

  function errorText(err) {
    const n = err && err.name;
    if (n === 'NotAllowedError' || n === 'SecurityError') return 'Camera access is blocked. Allow the camera in your browser’s site settings, then tap Try again.';
    if (n === 'NotFoundError' || n === 'OverconstrainedError') return 'No camera was found on this device.';
    return 'The camera didn’t start. Close other apps that are using it, then tap Try again.';
  }

  function showNote(text, canRetry) {
    noteText.textContent = text;
    $('retry').hidden = !canRetry;
    note.hidden = false;
  }

  async function startCamera() {
    stopCamera();
    note.hidden = true;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showNote('The camera needs a secure page. Open this app from an https address.', false);
      return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 960 } }
      });
    } catch (err) {
      showNote(errorText(err), true);
      return;
    }
    video.srcObject = stream;
    try { await video.play(); } catch (e) { /* autoplay is handled by the loop */ }
    view.classList.toggle('mirror', facing === 'user');
    running = true;
    startLoop();
  }

  /* ---- Feedback ---- */
  function refreshFlash() {
    if (reduceMotion.matches) return;
    $('refresh').animate([
      { opacity: 0, background: '#1b1c1b' },
      { opacity: 1, background: '#1b1c1b', offset: 0.35 },
      { opacity: 1, background: '#e4e5dd', offset: 0.7 },
      { opacity: 0, background: '#e4e5dd' }
    ], { duration: 280, easing: 'steps(4)' });
  }

  let toastTimer = 0;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 2200);
  }

  /* ---- Modes ---- */
  function setMode(m) {
    if (m === mode) return;
    mode = m;
    $('mBw').setAttribute('aria-pressed', String(m === 'bw'));
    $('mColor').setAttribute('aria-pressed', String(m === 'color'));
    refreshFlash();
  }
  $('mBw').addEventListener('click', () => setMode('bw'));
  $('mColor').addEventListener('click', () => setMode('color'));

  /* ---- Capture and save ---- */
  const pad = n => String(n).padStart(2, '0');
  function fileName() {
    const d = new Date();
    return 'eink-' + (mode === 'bw' ? 'bw' : 'color') + '-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) +
      '-' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds()) + '.png';
  }

  function makeFile() { return new File([currentBlob], currentName, { type: 'image/png' }); }
  function canShareFile() {
    try { return !!(navigator.canShare && navigator.canShare({ files: [makeFile()] })); } catch (e) { return false; }
  }

  $('shutter').addEventListener('click', async () => {
    if (!running || paused) return;
    refreshFlash();
    // Saved at 2x the working size with hard pixel edges, so the dither pattern stays crisp.
    const out = document.createElement('canvas');
    out.width = view.width * 2; out.height = view.height * 2;
    const c = out.getContext('2d');
    c.imageSmoothingEnabled = false;
    c.drawImage(view, 0, 0, out.width, out.height);
    const blob = await new Promise(r => out.toBlob(r, 'image/png'));
    if (!blob) { toast('The photo could not be created'); return; }
    currentBlob = blob;
    currentName = fileName();
    currentUrl = URL.createObjectURL(blob);
    shot.src = currentUrl;
    $('download').hidden = !canShareFile();
    paused = true;
    review.hidden = false;
  });

  function closeReview() {
    review.hidden = true;
    paused = false;
    const u = currentUrl;
    currentUrl = null;
    if (u) setTimeout(() => URL.revokeObjectURL(u), 4000);
  }

  function downloadFile() {
    const a = document.createElement('a');
    a.href = currentUrl; a.download = currentName;
    document.body.appendChild(a); a.click(); a.remove();
    closeReview();
    toast('Downloaded');
  }

  $('retake').addEventListener('click', closeReview);
  $('download').addEventListener('click', downloadFile);
  $('save').addEventListener('click', async () => {
    if (!currentBlob) return;
    if (canShareFile()) {
      try {
        await navigator.share({ files: [makeFile()], title: 'E-ink photo' });
        closeReview();
        toast('Shared');
      } catch (e) {
        if (e && e.name === 'AbortError') return;
        downloadFile();
      }
    } else {
      downloadFile();
    }
  });

  /* ---- Wiring ---- */
  $('flip').addEventListener('click', () => {
    facing = facing === 'environment' ? 'user' : 'environment';
    startCamera();
  });
  $('retry').addEventListener('click', startCamera);
  addEventListener('resize', () => { setSize(); layout(); });
  addEventListener('orientationchange', () => setTimeout(() => { setSize(); layout(); }, 200));
  addEventListener('pagehide', stopCamera);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    const t = stream && stream.getVideoTracks()[0];
    if (!t || t.readyState !== 'live') startCamera();
  });

  setSize();
  layout();
  startCamera();
})();
</script>
</body>
</html>
